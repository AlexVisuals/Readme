name: Profile summary cards

on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/profile-summary-cards.yml"]

concurrency:
  group: profile-summary-cards
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # The action clears its output folder on every run, so the light
      # cards are set aside while the dark ones are generated.
      - name: Generate light cards
        uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          NAME: Alejandro Poyatos
          UTC_OFFSET: 1
          THEME: github
          AUTO_PUSH: false

      - name: Set light cards aside
        run: sudo mv profile-summary-card-output/github "$RUNNER_TEMP/github"

      - name: Generate dark cards
        uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          NAME: Alejandro Poyatos
          UTC_OFFSET: 1
          THEME: github_dark
          AUTO_PUSH: false

      - name: Commit cards
        run: |
          sudo mv "$RUNNER_TEMP/github" profile-summary-card-output/github
          sudo chown -R "$(id -u):$(id -g)" profile-summary-card-output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-summary-card-output
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update profile summary cards"
            git push
          fi
