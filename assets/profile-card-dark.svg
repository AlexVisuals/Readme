<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="900" height="440" viewBox="0 0 900 440" role="img" aria-labelledby="title desc">
  <title id="title">Alex (AlexVisuals) — Web Application Development Student | Front-end Developer</title>
  <desc id="desc">Profile card: Alex, Web Application Development Student and Front-end Developer working with JavaScript, TypeScript and React. Based in Barcelona, Catalonia, Spain. Open to work.</desc>
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Noto Sans', 'Liberation Sans', sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; font-size: 13px; }
    .kw { fill: #C792EA; } .var { fill: #EEFFFF; } .prop { fill: #82AAFF; }
    .str { fill: #C3E88D; } .pn { fill: #A6ACCD; }
    .cursor { animation: blink 1.1s steps(1) infinite; }
    .glow { animation: pulse 7s ease-in-out infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes pulse { 0%, 100% { opacity: .55; } 50% { opacity: .9; } }
    @media (prefers-reduced-motion: reduce) { .cursor, .glow { animation: none; } }
  </style>
  <defs>
    <clipPath id="card"><rect x="0.5" y="0.5" width="899" height="439" rx="16"/></clipPath>
    <clipPath id="photo"><circle cx="140" cy="200" r="78"/></clipPath>
    <linearGradient id="cover" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#030A14"/>
      <stop offset=".45" stop-color="#0A1A36"/>
      <stop offset=".8" stop-color="#16296A"/>
      <stop offset="1" stop-color="#2B3C97"/>
    </linearGradient>
    <radialGradient id="glow" cx="760" cy="30" r="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7C8BFF" stop-opacity=".55"/>
      <stop offset=".5" stop-color="#4656C8" stop-opacity=".18"/>
      <stop offset="1" stop-color="#4656C8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="dotsFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="1"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#FFFFFF" fill-opacity=".09"/>
    </pattern>
    <mask id="dotsMask"><rect width="900" height="200" fill="url(#dotsFade)"/></mask>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2B3C97"/>
      <stop offset="1" stop-color="#0A1A36"/>
    </linearGradient>
    <linearGradient id="otw" x1="62" y1="0" x2="218" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#057642" stop-opacity="0"/>
      <stop offset=".22" stop-color="#057642"/>
      <stop offset=".8" stop-color="#057642"/>
      <stop offset="1" stop-color="#057642" stop-opacity="0"/>
    </linearGradient>
    <path id="otwPath" d="M75.65 169.99 A71 71 0 0 0 190.20 250.20"/>
  </defs>

  <g clip-path="url(#card)">
    <rect width="900" height="440" fill="#151B23"/>

    <!-- Cover -->
    <rect width="900" height="200" fill="url(#cover)"/>
    <rect width="900" height="200" fill="url(#glow)" class="glow"/>
    <rect width="900" height="200" fill="url(#dots)" mask="url(#dotsMask)"/>
    <path d="M0 160 C 140 120, 260 170, 400 140 S 640 90, 900 130 V200 H0Z" fill="#0E1F45" fill-opacity=".55"/>
    <path d="M0 182 C 180 150, 330 196, 520 168 S 760 150, 900 172 V200 H0Z" fill="#050E1F" fill-opacity=".7"/>

    <!-- Code window -->
    <g>
      <rect x="556" y="26" width="318" height="156" rx="10" fill="#0B1530" fill-opacity=".72" stroke="#FFFFFF" stroke-opacity=".1"/>
      <circle cx="574" cy="44" r="4.5" fill="#FF5F57"/>
      <circle cx="590" cy="44" r="4.5" fill="#FEBC2E"/>
      <circle cx="606" cy="44" r="4.5" fill="#28C840"/>
      <text x="862" y="48" text-anchor="end" class="sans" font-size="11" fill="#A6ACCD" fill-opacity=".7">profile.ts</text>
      <g class="mono">
      <text x="574" y="78" xml:space="preserve"><tspan class="kw">const </tspan><tspan class="var">alex</tspan><tspan class="pn"> = {</tspan></text>
      <text x="574" y="97" xml:space="preserve"><tspan class="pn">  </tspan><tspan class="prop">role</tspan><tspan class="pn">: </tspan><tspan class="str">"Web Developer"</tspan><tspan class="pn">,</tspan></text>
      <text x="574" y="116" xml:space="preserve"><tspan class="pn">  </tspan><tspan class="prop">based</tspan><tspan class="pn">: </tspan><tspan class="str">"Barcelona, ES"</tspan><tspan class="pn">,</tspan></text>
      <text x="574" y="135" xml:space="preserve"><tspan class="pn">  </tspan><tspan class="prop">stack</tspan><tspan class="pn">: [</tspan><tspan class="str">"JS"</tspan><tspan class="pn">, </tspan><tspan class="str">"TS"</tspan><tspan class="pn">, </tspan><tspan class="str">"React"</tspan><tspan class="pn">],</tspan></text>
      <text x="574" y="154" xml:space="preserve"><tspan class="pn">  </tspan><tspan class="prop">learning</tspan><tspan class="pn">: </tspan><tspan class="str">"Full-stack"</tspan><tspan class="pn">,</tspan></text>
      <text x="574" y="173" xml:space="preserve"><tspan class="pn">};</tspan></text>
      </g>
      <rect x="592" y="168" width="7.5" height="15" fill="#82AAFF" class="cursor"/>
    </g>
  </g>

  <!-- Avatar with #OpenToWork frame -->
  <circle cx="140" cy="200" r="83" fill="#151B23"/>
  <g clip-path="url(#photo)">
    <g transform="translate(62 122) scale(1.56)">
    <defs>
      <linearGradient id="avBase" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#0B1C40"/>
        <stop offset=".3" stop-color="#03101F"/>
        <stop offset=".6" stop-color="#010E14"/>
        <stop offset="1" stop-color="#000805"/>
      </linearGradient>
      <radialGradient id="avGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(52 64) rotate(62) scale(24 8)">
        <stop offset="0" stop-color="#B9C0EE"/>
        <stop offset=".3" stop-color="#6672D0"/>
        <stop offset=".7" stop-color="#2C3C9A" stop-opacity=".45"/>
        <stop offset="1" stop-color="#1A2A70" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="avHalo" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(30 40) rotate(32) scale(36 10)">
        <stop offset="0" stop-color="#4253B5" stop-opacity=".7"/>
        <stop offset="1" stop-color="#3B4CA7" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="avHaze" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(10 30) scale(34 24)">
        <stop offset="0" stop-color="#22418A" stop-opacity=".35"/>
        <stop offset="1" stop-color="#22418A" stop-opacity="0"/>
      </radialGradient>
      <filter id="avBlur" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2.2"/></filter>
    </defs>
    <rect width="100" height="100" fill="url(#avBase)"/>
    <rect width="100" height="100" fill="url(#avHaze)"/>
    <g filter="url(#avBlur)">
      <rect width="100" height="100" fill="url(#avHalo)"/>
      <rect width="100" height="100" fill="url(#avGlow)"/>
      <path d="M64 100 C 66 82, 72 64, 84 46 S 96 18, 100 10 V100Z" fill="#000A06" fill-opacity=".9"/>
      <path d="M0 70 C 14 68, 28 76, 38 92 L 41 100 H0Z" fill="#000905" fill-opacity=".85"/>
      <path d="M100 0 V 16 C 88 14, 76 8, 70 0Z" fill="#00110E" fill-opacity=".7"/>
    </g>
    <g fill="#FFFFFF"><polygon points="33.9,52 40.2,52 37,58.2 30.4,58.2"/><polygon points="63.1,41.7 69.4,41.7 66.4,47.9 59.7,47.9"/><polygon points="36.3,41.7 43.7,41.7 53.5,58.2 46.3,58.2"/><polygon points="45.9,41.7 53,41.7 63,58.2 55.9,58.2"/></g>
  </g>
    <path d="M79.28 171.68 A67 67 0 0 0 187.38 247.38" fill="none" stroke="url(#otw)" stroke-width="22"/>
  </g>
  <text class="sans" font-size="11.5" font-weight="700" letter-spacing="1.4" fill="#FFFFFF">
    <textPath href="#otwPath" xlink:href="#otwPath" startOffset="50%" text-anchor="middle">#OPENTOWORK</textPath>
  </text>

  <!-- Identity -->
  <g class="sans">
    <text x="40" y="330" fill="#E6EDF3">
      <tspan font-size="30" font-weight="700">Alex</tspan><tspan dx="10" font-size="16" fill="#9198A1">@AlexVisuals</tspan>
    </text>
    <text x="40" y="362" font-size="16.5" fill="#E6EDF3">Web Application Development Student | Front-end Developer</text>
    <text x="40" y="385" font-size="16.5" fill="#E6EDF3">JavaScript · TypeScript · React</text>
    <g transform="translate(38 401) scale(0.66)" fill="none" stroke="#9198A1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"/><circle cx="12" cy="10" r="3"/></g>
    <text x="58" y="414" font-size="14" fill="#9198A1">Barcelona, Catalonia, Spain<tspan dx="6">·</tspan><tspan dx="6" fill="#8B9BFF" font-weight="600">github.com/AlexVisuals</tspan></text>

    <!-- Right column: focus + education -->
    <g transform="translate(626 298)"><rect width="40" height="40" rx="8" fill="url(#tile)"/><g transform="translate(8.0 8.0) scale(1.0)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m18 16 4-4-4-4"/><path d="m6 8-4 4 4 4"/><path d="m14.5 4-5 16"/></g></g>
    <text x="678" y="315" font-size="14" font-weight="600" fill="#E6EDF3">Front-end Development</text>
    <text x="678" y="333" font-size="12.5" fill="#9198A1">Current focus</text>
    <g transform="translate(626 352)"><rect width="40" height="40" rx="8" fill="url(#tile)"/><g transform="translate(8.0 8.0) scale(1.0)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.42 10.922a1 1 0 0 0-.019-1.838L12.83 5.18a2 2 0 0 0-1.66 0L2.6 9.08a1 1 0 0 0 0 1.832l8.57 3.908a2 2 0 0 0 1.66 0z"/><path d="M22 10v6"/><path d="M6 12.5V16a6 3 0 0 0 12 0v-3.5"/></g></g>
    <text x="678" y="369" font-size="14" font-weight="600" fill="#E6EDF3">CFGS DAW</text>
    <text x="678" y="387" font-size="12.5" fill="#9198A1">Web Application Development</text>
  </g>

  <rect x="0.5" y="0.5" width="899" height="439" rx="16" fill="none" stroke="#30363D"/>
</svg>
